name: Build & Release

# Builds the mod jar on every push and publishes it as the "Latest build" release,
# so the newest jar is always one click away on the Releases page.
on:
  push:
    branches: [main, master, "claude/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 26

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon

      - name: Find the jar
        id: jar
        run: |
          JAR=$(ls build/libs/*.jar | grep -v -- '-sources' | head -n1)
          VERSION=$(grep '^version=' gradle.properties | cut -d= -f2)
          echo "path=$JAR" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: AbpsMod-${{ steps.jar.outputs.version }}
          path: ${{ steps.jar.outputs.path }}

      - name: Publish "Latest build" release
        env:
          GH_TOKEN: ${{ github.token }}
          JAR: ${{ steps.jar.outputs.path }}
          VERSION: ${{ steps.jar.outputs.version }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          git push origin :refs/tags/latest || true
          gh release create latest "$JAR" \
            --target "$GITHUB_SHA" \
            --title "AbpsMod $VERSION" \
            --latest \
            --notes "**Install:** download \`$(basename "$JAR")\` below and put it in your \`mods\` folder along with Fabric API (Minecraft 26.3, Fabric Loader, Java 26)."
