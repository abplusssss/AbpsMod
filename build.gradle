plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

base {
	archivesName = "AbpsMod"
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"abpsmod" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version
	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = "UTF-8"
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

// Dev only: ./gradlew runServer -Pselftest runs every ability and command once, then stops
loom {
	runs {
		server {
			if (project.hasProperty("selftest")) vmArg "-Dabps.selftest=true"
		}
		client {
			if (project.hasProperty("uitest")) {
				vmArg "-Dabps.uitest=true"
				programArgs "--username", "AbpsTester", "--quickPlayMultiplayer", "localhost:25599"
			}
			if (project.hasProperty("fxtest")) {
				vmArg "-Dabps.fxtest=" + project.property("fxtest")
				if (project.hasProperty("fxvideo")) vmArg "-Dabps.fxvideo=true"
				programArgs "--username", "AbpsTester", "--quickPlayMultiplayer", "localhost:25599"
			}
			if (project.hasProperty("clienttest")) {
				vmArg "-Dabps.clienttest=true"
				programArgs "--username", "AbpsTester", "--quickPlayMultiplayer", "localhost:25599"
			}
		}
	}
}
